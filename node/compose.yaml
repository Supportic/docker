# https://www.compose-spec.io/

services:
  node:
    container_name: ${PROJECT_NAME}-node
    image: ${PROJECT_NAME}/node:0.0.1
    build:
      context: .
      dockerfile: .docker/service/node/Dockerfile
      args:
        - NODE_VER=${NODE_VER}
        - UID=${UID}
        - GID=${GID}
        - UNAME=${UNAME}
        - GNAME=${GNAME}
        - PASS=${PASS}
      target: develop
    user: ${UID:-1000}
    working_dir: /app
    volumes:
      - ./app:/app
